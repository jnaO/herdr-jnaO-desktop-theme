# The repo's only dependencies are the actions its workflows use.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release must have been out this long before it is proposed.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    open-pull-requests-limit: 1
